name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    # Release tags drive the `release` job below. Branch pushes still run
    # analyze/build_ios exactly as before; only a v* tag publishes anything.
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
      - run: flutter pub get
      # --no-fatal-infos: this codebase carries a known, accepted baseline
      # of ~330 info-level lints (deprecated withOpacity, prefer_const,
      # curly-braces style, etc.) with zero warnings/errors — flutter
      # analyze treats info-level issues as fatal by default, which made
      # this step fail on every push/PR regardless of real correctness.
      - run: flutter analyze --no-fatal-infos

      # Standing assertion that no fixed-size box holds text it cannot fit at
      # the 2.0x accessibility text scale, and that no control is under the
      # 48dp touch floor. `flutter analyze` cannot see either: both are
      # arithmetic about rendered geometry, not type errors.
      #
      # The audit that produced this found six bursting boxes between 1.67x
      # and 1.94x, one of them the login screen's own wordmark -- so a reader
      # with large text met a broken login screen before they could sign in.
      # Source-only, so it needs no secrets and belongs here rather than
      # beside the PostgREST guards in db_security.
      - name: Audit UI bounds (text fit at 2.0x, 48dp touch targets)
        run: python3 .github/scripts/check_ui_bounds.py

      # Nothing in this repo type-checked the edge functions until now, and the
      # gap was not theoretical: a stray backtick inside a template literal in
      # _shared/email_templates.ts made ALL THREE mail functions fail to bundle.
      # `flutter analyze` cannot see TypeScript and the Dart test suite never
      # loads it, so the only thing that noticed was `supabase functions
      # deploy` — which runs AFTER the commit is already on main. That is a
      # window in which registration mail is broken and the repo looks green.
      #
      # `deno check` parses and type-checks without deploying, so the same
      # class of error fails the PR instead. Every function is listed rather
      # than globbed, so adding one is a deliberate act that shows up in review.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # SCOPED, and the exclusions are a decision rather than an oversight.
      # Every auth and mail function is covered — the whole registration path,
      # which is where a bundle failure costs someone an account. Five others
      # are left out because they ALREADY fail type-checking, measured:
      #
      #   send-notification   1   'err' is of type 'unknown'
      #   trigger-sos-alert   1   'err' is of type 'unknown'
      #   delete-user         1   'authData.user' is possibly 'null'
      #   check-push-status   1   'err' is of type 'unknown'
      #   parse-routine       3   same two shapes
      #
      # Those are real latent bugs, not noise: `err.message` on a non-Error
      # throw gives "undefined" instead of a reason, and the null user is a
      # genuine dereference. But they are in functions this change never
      # touched, and fixing them means redeploying working code that nothing
      # here tests. Fix them deliberately, then move the file into this list —
      # the list is the todo.
      - name: Type-check Supabase edge functions (auth + mail path)
        run: |
          deno check --no-lock \
            supabase/functions/register-request/index.ts \
            supabase/functions/register-verify/index.ts \
            supabase/functions/register-review-request/index.ts \
            supabase/functions/register-admin-approve/index.ts \
            supabase/functions/password-reset/index.ts \
            supabase/functions/email-dispatch/index.ts \
            supabase/functions/announce-release/index.ts

  # Standing assertion that no SECURITY DEFINER function is reachable by
  # `anon`. CREATE FUNCTION grants EXECUTE to PUBLIC by default, so a new
  # definer RPC is exposed unless its author remembers to REVOKE — which has
  # now been missed three times in this repo (see the script's own docstring).
  # Runs on every push/PR because the drift arrives with a migration, not with
  # a release. Cheap: one PostgREST call, no Flutter toolchain.
  db_security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit SECURITY DEFINER function ACLs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 .github/scripts/check_definer_acls.py

      # Standing assertion that a notification's in-app audience (written by a
      # trigger) and its push audience (sent by the client) cannot describe
      # different people. They already had, twice, invisibly -- this project has
      # no dept_admin, so a recipient COUNT matched while the rule was wrong.
      # See the script's docstring for the two live cases.
      - name: Audit notification audience consistency
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 .github/scripts/check_notification_audiences.py

      # Standing assertion that every column name in Dart actually exists.
      # This class has cost the project twice and both times SILENTLY:
      # profiles.designation killed the whole Profile Inspection screen (one
      # unknown name makes PostgREST reject the entire select), and six wrong
      # names in the backup PDF's column map made a class-routine backup print
      # no course and no room while still looking complete. Neither was caught
      # by review; both are caught by this.
      - name: Audit column names against the live schema
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 .github/scripts/check_column_names.py

  # No Mac in this project's dev environment (Windows), so this is the only
  # way to know an iOS-breaking change shipped -- macos-latest runners
  # ship Xcode, so this actually compiles the app for iOS (catching missing
  # platform implementations, iOS-specific API breakage, plugin
  # incompatibilities) on every push/PR. --no-codesign skips certificate/
  # provisioning-profile signing entirely, since that needs a paid Apple
  # Developer account this project doesn't have -- it can't produce an
  # installable .ipa, only prove the app still builds for iOS.
  build_ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

  # Publishes the Android APK to a GitHub Release. Until this existed, every
  # release was manual and therefore kept being forgotten -- 2.2.0 through
  # 2.3.1 all shipped to Vercel with no GitHub Release and no APK anywhere but
  # the maintainer's disk. Runs ONLY on a v* tag, so ordinary pushes to main
  # stay as cheap as they were.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the release and upload the asset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
      - run: flutter pub get

      # `flutter clean` is deliberate, not cargo-culting: building a debug APK
      # before a release one regenerates GeneratedPluginRegistrant.java with
      # the debug-only integration_test plugin, and the release compile then
      # fails with "package dev.flutter.plugins.integration_test does not
      # exist". A clean runner shouldn't hit it, but this job must never be
      # the thing that silently ships a stale artifact.
      - run: flutter clean
      - run: flutter pub get

      # android/app/google-services.json is gitignored (.gitignore:54), so the
      # runner has no copy and `:app:processReleaseGoogleServices` failed with
      # "File google-services.json is missing" — which is why every tagged
      # release from 2.2.0 to 2.3.1 produced no APK.
      #
      # Restored from an encrypted repo secret rather than being committed: this
      # repo is PUBLIC, and the file identifies the Firebase project. This job
      # is already gated to `refs/tags/v*` (see `if:` above), and GitHub never
      # passes secrets to pull_request runs from forks, so the value is only
      # ever available to a tag push by someone with write access.
      #
      # Passed via `env:` rather than interpolated into the script body, so the
      # value never appears in a command line; and the emptiness check makes a
      # missing/rotated secret fail loudly here instead of surfacing as a
      # confusing Gradle error six minutes later.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set. Set it with:"
            echo "::error::  gh secret set GOOGLE_SERVICES_JSON < android/app/google-services.json"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          # Confirm it parses, without ever printing the contents.
          python3 -c "import json,sys; json.load(open('android/app/google-services.json'))" \
            || { echo "::error::Restored google-services.json is not valid JSON."; exit 1; }
          echo "google-services.json restored ($(wc -c < android/app/google-services.json) bytes)"

      # Reconstructs android/key.properties + the keystore from repo secrets so
      # the APK is signed with the project's real key instead of the public
      # Android debug key (which would let anyone forge an "update" for it).
      #
      # Warns rather than fails when the secrets are absent: until the
      # maintainer has generated a keystore there is nothing to sign with, and
      # refusing to publish at all would be a worse outcome than publishing a
      # debug-signed build the way every release so far already has. The
      # warning is deliberately loud because a silent fallback is exactly how
      # this went unnoticed.
      #
      # Generate and register the key once with:
      #   keytool -genkey -v -keystore afos-release.jks -keyalg RSA \
      #           -keysize 2048 -validity 10000 -alias afos
      #   base64 -w0 afos-release.jks | gh secret set ANDROID_KEYSTORE_BASE64
      #   gh secret set ANDROID_KEYSTORE_PASSWORD
      #   gh secret set ANDROID_KEY_ALIAS
      #   gh secret set ANDROID_KEY_PASSWORD
      # Keep afos-release.jks backed up: losing it means you can never ship an
      # upgrade to an already-installed app again.
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - this APK will be signed with the PUBLIC Android debug key."
            echo "::warning::Anyone can forge an update for a debug-signed build. See this step's comment for the keytool + gh secret commands."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/afos-release.jks
          # Written with a restrictive mode and never echoed.
          umask 077
          cat > android/key.properties <<EOF
          storeFile=afos-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "Release keystore restored ($(wc -c < android/app/afos-release.jks) bytes)."

      # Universal FIRST — it is what the in-app updater downloads, and the
      # signature gate below verifies it specifically.
      # THIS REPO IS PUBLIC. Fail the build if an agent/editor scratch
      # directory or a credential-shaped file has been committed, rather than
      # relying on someone noticing it in a diff. `.codex/` was tracked until
      # 2026-08-16 before anyone spotted it.
      - name: Refuse to publish agent scratch dirs or secrets
        run: |
          BAD=$(git ls-files | grep -E '^\.(codex|claude|cursor|aider|continue|gemini|opencode|roo)/|(^|/)(key\.properties|.*\.jks|.*\.keystore|\.env|.*\.pem|.*\.p12)$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::These must never be committed to a public repo:"
            echo "$BAD"
            exit 1
          fi
          echo "No scratch directories or credential files are tracked."

      - run: flutter build apk --release

      # And the per-ABI splits, for people downloading by hand.
      #
      # WHY BOTH. The universal APK carries native code for all three ABIs and
      # weighs ~92 MB; the arm64-v8a split is ~34 MB for the identical app —
      # a 63% smaller download, which matters a great deal to a student on
      # mobile data. But a split only installs on a matching device, so it
      # cannot be the file the in-app updater blindly fetches, and it must not
      # be the one an unsure first-timer picks. Universal stays the default and
      # keeps its name; the splits are the informed choice.
      - run: flutter build apk --split-per-abi --release

      # Proves the APK is NOT debug-signed before it is published. Without
      # this, a mistyped secret would silently produce a debug-signed release
      # that looks completely normal until users can't install the next update.
      # Pins the exact certificate the APK must be signed with. An earlier
      # version of this step only checked that the DN wasn't "CN=Android
      # Debug", which passed VACUOUSLY: apksigner produced no matching line,
      # the empty string didn't match the debug pattern, and it reported
      # success without ever having seen a certificate. v2.5.4 shipped signed
      # with a stale keystore that way, because ANDROID_KEYSTORE_BASE64 still
      # held the first key generated on 2026-07-25 and was never re-set after
      # the keystore was regenerated on 2026-07-26.
      #
      # A certificate fingerprint is public (it ships inside every APK), so
      # pinning it here in cleartext discloses nothing. It is the app's
      # permanent identity: Android refuses an update signed by a different
      # key, so shipping the wrong one forces every user to uninstall and
      # reinstall. That mistake is only cheap before the first install, which
      # is exactly why this must fail the build rather than warn.
      - name: Verify release signature
        env:
          # Via env, not `${{ }}` inline: interpolating a secret into the
          # command line puts it in the process table and in `set -x` output.
          # Only its emptiness is ever tested.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          EXPECTED_SHA256: 2f49802b7533aa2f193b30de86edd7f124c3ebbf0e6196fb0c05ca614a03623f
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)

          # Diagnostics, unconditionally. The v2.5.4 and v2.5.5 runs both got
          # NOTHING out of apksigner — empty capture, exit 0 — and the log gave
          # no way to tell why, because the previous version of this step threw
          # away stderr and printed only its own conclusion. That silence is
          # exactly what let the old "is the DN CN=Android Debug?" check pass
          # without ever having seen a certificate.
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "APKSIGNER=${APKSIGNER:-<none>}"
          ls -l "$APK" || true

          CERTS=""
          RC=0
          if [ -n "$APKSIGNER" ]; then
            # 2>&1: apksigner puts warnings, and on some setups everything, on
            # stderr. set +e so a non-zero verdict is reported here rather than
            # aborting the step via `bash -e` with no explanation.
            set +e
            CERTS=$("$APKSIGNER" verify --print-certs "$APK" 2>&1)
            RC=$?
            set -e
          fi
          echo "apksigner exit=$RC"
          echo "----- apksigner output -----"
          echo "$CERTS"
          echo "----------------------------"

          ACTUAL=$(printf '%s\n' "$CERTS" | grep -m1 -i 'certificate SHA-256 digest:' \
                   | awk '{print $NF}' | tr 'A-Z' 'a-z' | tr -d '[:space:]')

          # Fallback only. keytool ships with the JDK this job already installs,
          # but -printcert -jarfile reads the v1/JAR signature ONLY — a Flutter
          # release APK signed with just v2/v3 yields nothing here, which was
          # verified locally against a real published APK before relying on it.
          if [ -z "$ACTUAL" ]; then
            echo "apksigner gave no digest; trying keytool (v1 signatures only)"
            ACTUAL=$(keytool -printcert -jarfile "$APK" 2>/dev/null \
                     | grep -m1 -i 'SHA256:' \
                     | sed 's/.*SHA256:[[:space:]]*//; s/://g' \
                     | tr 'A-Z' 'a-z' | tr -d '[:space:]')
          fi
          echo "resolved SHA-256: ${ACTUAL:-<none>}"

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::Publishing a DEBUG-SIGNED release APK (no keystore secret configured)."
            exit 0
          fi

          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not read the APK's signing certificate. Refusing to publish an unverified build."
            echo "::error::See the apksigner output above for why."
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "::error::APK is signed with the WRONG key."
            echo "::error::  expected $EXPECTED_SHA256"
            echo "::error::  actual   $ACTUAL"
            echo "::error::Re-set ANDROID_KEYSTORE_BASE64 (and the password/alias secrets) from the current android/app/afos-release.jks."
            exit 1
          fi
          echo "APK signature verified against the pinned certificate ($ACTUAL)."

      # Name the artifact after the tag so downloads are self-identifying
      # rather than a pile of interchangeable app-release.apk files.
      - name: Name the APK after the tag
        run: |
          mkdir -p dist
          # The universal build keeps this exact name: AppUpdateService builds
          # `.../download/<tag>/AFOS-<tag>.apk` from the version string, so
          # renaming it breaks every installed phone's Update button.
          cp build/app/outputs/flutter-apk/app-release.apk "dist/AFOS-${GITHUB_REF_NAME}.apk"
          # The splits carry their ABI in the name so a downloader can tell
          # them apart at a glance, and so a wrong pick is obvious rather than
          # mysterious.
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="build/app/outputs/flutter-apk/app-$abi-release.apk"
            [ -f "$src" ] && cp "$src" "dist/AFOS-${GITHUB_REF_NAME}-$abi.apk"
          done
          ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      # NOTE: the in-app "What's New" row (app_releases table) is written BY
      # HAND after each release — deliberately, do not automate it again.
      #
      # There used to be a step here that generated it from commit subject
      # lines. It produced garbage: v2.5.3's entire What's New read
      # "fix: PostgREST profiles embeds on enrollments/course_offerings
      # (v2.5.3)" — a raw conventional-commit subject shown to students.
      # Commit subjects are written for developers reading `git log`; release
      # notes are written for someone deciding whether to install an update.
      # They are not the same text and mechanically deriving one from the
      # other cannot work.
      #
      # Compare a hand-written entry (2.3.2): "Admin approvals now update
      # immediately — two screens open at once used to silently kill each
      # other's live connection, so a decision looked like it had not saved."
      #
      # Write the row manually against the app_releases table
      # (version, release_date, title, highlights[], platforms[]).
