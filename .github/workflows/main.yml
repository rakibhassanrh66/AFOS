name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    # Release tags drive the `release` job below. Branch pushes still run
    # analyze/build_ios exactly as before; only a v* tag publishes anything.
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
      - run: flutter pub get
      # --no-fatal-infos: this codebase carries a known, accepted baseline
      # of ~330 info-level lints (deprecated withOpacity, prefer_const,
      # curly-braces style, etc.) with zero warnings/errors — flutter
      # analyze treats info-level issues as fatal by default, which made
      # this step fail on every push/PR regardless of real correctness.
      - run: flutter analyze --no-fatal-infos

  # Standing assertion that no SECURITY DEFINER function is reachable by
  # `anon`. CREATE FUNCTION grants EXECUTE to PUBLIC by default, so a new
  # definer RPC is exposed unless its author remembers to REVOKE — which has
  # now been missed three times in this repo (see the script's own docstring).
  # Runs on every push/PR because the drift arrives with a migration, not with
  # a release. Cheap: one PostgREST call, no Flutter toolchain.
  db_security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit SECURITY DEFINER function ACLs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 .github/scripts/check_definer_acls.py

  # No Mac in this project's dev environment (Windows), so this is the only
  # way to know an iOS-breaking change shipped -- macos-latest runners
  # ship Xcode, so this actually compiles the app for iOS (catching missing
  # platform implementations, iOS-specific API breakage, plugin
  # incompatibilities) on every push/PR. --no-codesign skips certificate/
  # provisioning-profile signing entirely, since that needs a paid Apple
  # Developer account this project doesn't have -- it can't produce an
  # installable .ipa, only prove the app still builds for iOS.
  build_ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

  # Publishes the Android APK to a GitHub Release. Until this existed, every
  # release was manual and therefore kept being forgotten -- 2.2.0 through
  # 2.3.1 all shipped to Vercel with no GitHub Release and no APK anywhere but
  # the maintainer's disk. Runs ONLY on a v* tag, so ordinary pushes to main
  # stay as cheap as they were.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the release and upload the asset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
      - run: flutter pub get

      # `flutter clean` is deliberate, not cargo-culting: building a debug APK
      # before a release one regenerates GeneratedPluginRegistrant.java with
      # the debug-only integration_test plugin, and the release compile then
      # fails with "package dev.flutter.plugins.integration_test does not
      # exist". A clean runner shouldn't hit it, but this job must never be
      # the thing that silently ships a stale artifact.
      - run: flutter clean
      - run: flutter pub get

      # android/app/google-services.json is gitignored (.gitignore:54), so the
      # runner has no copy and `:app:processReleaseGoogleServices` failed with
      # "File google-services.json is missing" — which is why every tagged
      # release from 2.2.0 to 2.3.1 produced no APK.
      #
      # Restored from an encrypted repo secret rather than being committed: this
      # repo is PUBLIC, and the file identifies the Firebase project. This job
      # is already gated to `refs/tags/v*` (see `if:` above), and GitHub never
      # passes secrets to pull_request runs from forks, so the value is only
      # ever available to a tag push by someone with write access.
      #
      # Passed via `env:` rather than interpolated into the script body, so the
      # value never appears in a command line; and the emptiness check makes a
      # missing/rotated secret fail loudly here instead of surfacing as a
      # confusing Gradle error six minutes later.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set. Set it with:"
            echo "::error::  gh secret set GOOGLE_SERVICES_JSON < android/app/google-services.json"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          # Confirm it parses, without ever printing the contents.
          python3 -c "import json,sys; json.load(open('android/app/google-services.json'))" \
            || { echo "::error::Restored google-services.json is not valid JSON."; exit 1; }
          echo "google-services.json restored ($(wc -c < android/app/google-services.json) bytes)"

      # Reconstructs android/key.properties + the keystore from repo secrets so
      # the APK is signed with the project's real key instead of the public
      # Android debug key (which would let anyone forge an "update" for it).
      #
      # Warns rather than fails when the secrets are absent: until the
      # maintainer has generated a keystore there is nothing to sign with, and
      # refusing to publish at all would be a worse outcome than publishing a
      # debug-signed build the way every release so far already has. The
      # warning is deliberately loud because a silent fallback is exactly how
      # this went unnoticed.
      #
      # Generate and register the key once with:
      #   keytool -genkey -v -keystore afos-release.jks -keyalg RSA \
      #           -keysize 2048 -validity 10000 -alias afos
      #   base64 -w0 afos-release.jks | gh secret set ANDROID_KEYSTORE_BASE64
      #   gh secret set ANDROID_KEYSTORE_PASSWORD
      #   gh secret set ANDROID_KEY_ALIAS
      #   gh secret set ANDROID_KEY_PASSWORD
      # Keep afos-release.jks backed up: losing it means you can never ship an
      # upgrade to an already-installed app again.
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - this APK will be signed with the PUBLIC Android debug key."
            echo "::warning::Anyone can forge an update for a debug-signed build. See this step's comment for the keytool + gh secret commands."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/afos-release.jks
          # Written with a restrictive mode and never echoed.
          umask 077
          cat > android/key.properties <<EOF
          storeFile=afos-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "Release keystore restored ($(wc -c < android/app/afos-release.jks) bytes)."

      - run: flutter build apk --release

      # Proves the APK is NOT debug-signed before it is published. Without
      # this, a mistyped secret would silently produce a debug-signed release
      # that looks completely normal until users can't install the next update.
      - name: Verify release signature
        env:
          # Via env, not `${{ }}` inline: interpolating a secret into the
          # command line puts it in the process table and in `set -x` output.
          # Only its emptiness is ever tested.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          # Several build-tools versions can be installed; take the newest so
          # the glob can't expand to multiple arguments.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner not found, skipping signature verification."
            exit 0
          fi
          SIGNER=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'Signer #1 certificate DN' || true)
          echo "$SIGNER"
          if echo "$SIGNER" | grep -q 'CN=Android Debug'; then
            if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
              echo "::error::A keystore secret is set but the APK is still debug-signed - the signing config did not apply."
              exit 1
            fi
            echo "::warning::Publishing a DEBUG-SIGNED release APK (no keystore secret configured)."
          else
            echo "APK is signed with a non-debug certificate."
          fi

      # Name the artifact after the tag so downloads are self-identifying
      # rather than a pile of interchangeable app-release.apk files.
      - name: Name the APK after the tag
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/AFOS-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      # NOTE: the in-app "What's New" row (app_releases table) is written BY
      # HAND after each release — deliberately, do not automate it again.
      #
      # There used to be a step here that generated it from commit subject
      # lines. It produced garbage: v2.5.3's entire What's New read
      # "fix: PostgREST profiles embeds on enrollments/course_offerings
      # (v2.5.3)" — a raw conventional-commit subject shown to students.
      # Commit subjects are written for developers reading `git log`; release
      # notes are written for someone deciding whether to install an update.
      # They are not the same text and mechanically deriving one from the
      # other cannot work.
      #
      # Compare a hand-written entry (2.3.2): "Admin approvals now update
      # immediately — two screens open at once used to silently kill each
      # other's live connection, so a decision looked like it had not saved."
      #
      # Write the row manually against the app_releases table
      # (version, release_date, title, highlights[], platforms[]).
